<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Anatolia Guides — Coming soon</title>
<meta name="description" content="Expert guides to Türkiye's ancient sites. Coming soon.">
<link rel="icon" type="image/png" href="https://res.cloudinary.com/dsnmabr1p/image/upload/v1776530616/u2791417416_anadolu_kltrndeki_ana_tanra_kibelenin_mermerden_b_44c980b9-ad85-4973-8768-f04a1de1f095_3_tsqin4.png">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600&family=Crimson+Pro:ital,wght@0,300;0,400;1,300&display=swap" rel="stylesheet">
<script>
  // Eski değerlendirme linkleri (?degerlendirme=…) uygulamada açılmaya devam etsin
  if (/[?&]degerlendirme=/.test(location.search)) location.replace('uygulama.html' + location.search);
</script>
<style>
  :root { --vurgu: #B85C2A; --altin: #C9A84C; --gece: #0E0D0B; }
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body { font-family: 'Crimson Pro', Georgia, serif; color: #F1ECE3; background: var(--gece); overflow-x: hidden; }
  .arka { position: fixed; inset: 0; background: url('https://res.cloudinary.com/dsnmabr1p/image/upload/f_auto,q_auto,w_2000/kaunos_1_usvci0') center 40% / cover; transform: scale(1.06); animation: yaklas 22s ease-out forwards; }
  @keyframes yaklas { to { transform: scale(1); } }
  .arka::after { content: ''; position: absolute; inset: 0; background: linear-gradient(180deg, rgba(10,9,8,.55) 0%, rgba(10,9,8,.45) 40%, rgba(10,9,8,.9) 100%); }
  .sayfa { position: relative; z-index: 1; min-height: 100%; display: flex; flex-direction: column; padding: 32px 48px; }
  .ust { display: flex; justify-content: space-between; align-items: center; }
  .logo { font-family: 'Cinzel', serif; font-size: 20px; font-weight: 600; letter-spacing: 4px; white-space: nowrap; }
  .logo span { color: var(--vurgu); }
  .diller { display: flex; gap: 4px; }
  .diller button { background: none; border: 1px solid transparent; color: rgba(241,236,227,.7); font-family: 'Cinzel', serif; font-size: 12px; letter-spacing: 2px; padding: 5px 10px; border-radius: 20px; cursor: pointer; }
  .diller button.aktif { border-color: rgba(241,236,227,.6); color: #fff; }
  main { flex: 1; display: flex; flex-direction: column; justify-content: center; max-width: 820px; padding: 60px 0; }
  .etiket { font-family: 'Cinzel', serif; font-size: 13px; letter-spacing: 6px; color: var(--altin); margin-bottom: 26px; }
  h1 { font-family: 'Cinzel', serif; font-weight: 500; font-size: clamp(36px, 6vw, 68px); line-height: 1.12; margin-bottom: 26px; }
  .alt { font-size: clamp(19px, 2.2vw, 24px); font-weight: 300; color: rgba(241,236,227,.82); max-width: 640px; line-height: 1.6; }
  .cizgi { width: 56px; height: 1px; background: var(--vurgu); margin: 36px 0; }
  .yakinda { font-family: 'Cinzel', serif; font-size: 15px; letter-spacing: 4px; text-transform: uppercase; }
  footer { display: flex; justify-content: space-between; align-items: flex-end; gap: 20px; font-size: 14px; color: rgba(241,236,227,.6); }
  footer i { font-size: 13px; }
  @media (max-width: 640px) { .sayfa { padding: 22px 20px; } .logo { font-size: 14px; letter-spacing: 2px; } .diller button { padding: 4px 6px; } footer { flex-direction: column; align-items: flex-start; } }
</style>
</head>
<body>
<div class="arka"></div>
<div class="sayfa">
  <header class="ust">
    <div class="logo">ANATOLIA <span>G</span>UIDES</div>
    <div class="diller" id="diller"></div>
  </header>
  <main>
    <div class="etiket" id="etiket"></div>
    <h1 id="baslik"></h1>
    <p class="alt" id="alt"></p>
    <div class="cizgi"></div>
    <div class="yakinda" id="yakinda"></div>
  </main>
  <footer>
    <span>© <span id="yil"></span> Anatolia Guides · anatoliaguides.com</span>
    <i id="imza"></i>
  </footer>
</div>
<script>
const M = {
  en: { etiket: 'ANATOLIA GUIDES', baslik: 'Expert guides to Türkiye\'s ancient sites', alt: '118 ancient sites, ten thousand years of history, and the guides who tell it best — in English, German, Russian and Turkish.', yakinda: 'Coming soon', imza: 'Rock tombs of Kaunos, Dalyan — 4th century BC' },
  de: { etiket: 'ANATOLIA GUIDES', baslik: 'Erfahrene Reiseleiter für die antiken Stätten der Türkei', alt: '118 antike Stätten, zehntausend Jahre Geschichte und die Reiseleiter, die sie am besten erzählen – auf Deutsch, Englisch, Russisch und Türkisch.', yakinda: 'Bald verfügbar', imza: 'Felsgräber von Kaunos, Dalyan — 4. Jh. v. Chr.' },
  ru: { etiket: 'ANATOLIA GUIDES', baslik: 'Опытные гиды по античным памятникам Турции', alt: '118 памятников, десять тысяч лет истории и гиды, которые расскажут её лучше всех — на русском, английском, немецком и турецком.', yakinda: 'Скоро открытие', imza: 'Скальные гробницы Кавна, Дальян — IV в. до н. э.' },
  tr: { etiket: 'ANADOLU REHBERİ', baslik: 'Türkiye\'nin ören yerlerinde uzman rehberler', alt: '118 ören yeri, on bin yıllık tarih ve onu en iyi anlatan rehberler — Türkçe, İngilizce, Almanca ve Rusça.', yakinda: 'Çok yakında', imza: 'Kaunos kaya mezarları, Dalyan — M.Ö. 4. yüzyıl' }
};
let dil = (navigator.language || 'en').slice(0, 2);
if (!M[dil]) dil = 'en';
function ciz() {
  document.documentElement.lang = dil;
  for (const k of ['etiket', 'baslik', 'alt', 'yakinda', 'imza']) document.getElementById(k).textContent = M[dil][k];
  document.getElementById('diller').innerHTML = ['en', 'de', 'ru', 'tr'].map(d => `<button class="${d === dil ? 'aktif' : ''}" onclick="dil='${d}';ciz()">${d.toUpperCase()}</button>`).join('');
}
document.getElementById('yil').textContent = new Date().getFullYear();
ciz();
</script>
</body>
</html>
