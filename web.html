<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Anadolu Rehberi — Ören yerleri ve uzman rehberler</title>
<meta name="description" content="Anadolu'nun 118 ören yerini hikâyeleriyle keşfedin, uzman rehberle gezin. Türkçe, English, Deutsch, Русский.">
<link rel="icon" type="image/png" href="https://res.cloudinary.com/dsnmabr1p/image/upload/v1776530616/u2791417416_anadolu_kltrndeki_ana_tanra_kibelenin_mermerden_b_44c980b9-ad85-4973-8768-f04a1de1f095_3_tsqin4.png">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600&family=Crimson+Pro:ital,wght@0,300;0,400;0,500;0,600;1,300;1,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
  // Telefonda mobil uygulamayı aç (web sürümünü zorla görmek için ?web)
  if (window.innerWidth < 760 && !/[?&]web\b/.test(location.search)) location.replace('index.html' + location.hash);
</script>
<style>
  :root {
    --kagit: #FAFAF8; --kagit2: #F3F1EC; --murekkep: #1A1A18; --gri: #6B6B67; --gri2: #9B9B97;
    --cizgi: #E8E6E0; --vurgu: #B85C2A; --vurgu2: #9A4A20; --gece: #12110F; --gece2: #1E1C19; --altin: #C9A84C;
    --serif: 'Crimson Pro', Georgia, serif; --baslik: 'Cinzel', serif;
    --genislik: 1200px;
  }
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html { scroll-behavior: smooth; }
  body { font-family: var(--serif); font-size: 19px; line-height: 1.6; color: var(--murekkep); background: var(--kagit); -webkit-font-smoothing: antialiased; }
  a { color: inherit; text-decoration: none; }
  img { display: block; max-width: 100%; }
  button, input, select, textarea { font-family: inherit; font-size: inherit; color: inherit; }
  .kap { max-width: var(--genislik); margin: 0 auto; padding: 0 40px; }

  /* ÜST MENÜ */
  .ust { position: sticky; top: 0; z-index: 50; background: rgba(250,250,248,0.94); backdrop-filter: blur(8px); border-bottom: 1px solid var(--cizgi); }
  .ust .kap { display: flex; align-items: center; height: 76px; gap: 36px; }
  .logo { font-family: var(--baslik); font-size: 22px; font-weight: 600; letter-spacing: 3px; white-space: nowrap; }
  .logo span { color: var(--vurgu); }
  .logo small { display: block; font-family: var(--serif); font-size: 11px; font-weight: 400; letter-spacing: 2px; color: var(--gri2); margin-top: -2px; }
  .menu { display: flex; gap: 28px; flex: 1; }
  .menu a { font-size: 16px; color: var(--gri); padding: 6px 0; border-bottom: 1px solid transparent; transition: color .2s, border-color .2s; }
  .menu a:hover, .menu a.aktif { color: var(--murekkep); border-bottom-color: var(--vurgu); }
  .dil-sec { display: flex; gap: 2px; border: 1px solid var(--cizgi); border-radius: 20px; padding: 3px; }
  .dil-sec button { border: 0; background: none; padding: 3px 9px; border-radius: 14px; font-size: 13px; letter-spacing: 1px; color: var(--gri); cursor: pointer; }
  .dil-sec button.aktif { background: var(--murekkep); color: #fff; }
  .btn { display: inline-flex; align-items: center; gap: 8px; border: 1px solid var(--murekkep); background: var(--murekkep); color: #fff; padding: 12px 26px; border-radius: 2px; font-size: 16px; letter-spacing: .5px; cursor: pointer; transition: background .2s, border-color .2s, color .2s; white-space: nowrap; }
  .btn:hover { background: var(--vurgu); border-color: var(--vurgu); }
  .btn.vurgu { background: var(--vurgu); border-color: var(--vurgu); }
  .btn.vurgu:hover { background: var(--vurgu2); border-color: var(--vurgu2); }
  .btn.cerceve { background: transparent; color: var(--murekkep); }
  .btn.cerceve:hover { background: var(--murekkep); color: #fff; }
  .btn.acik { background: transparent; color: #fff; border-color: rgba(255,255,255,.6); }
  .btn.acik:hover { background: #fff; color: var(--murekkep); }
  .btn:disabled { opacity: .5; cursor: default; }

  /* GENEL BÖLÜM */
  .bolum { padding: 110px 0; }
  .bolum.ince { padding: 70px 0; }
  .bolum.gece { background: var(--gece); color: #E9E3D8; }
  .bolum.kagit2 { background: var(--kagit2); }
  .ust-etiket { font-family: var(--baslik); font-size: 12px; letter-spacing: 4px; text-transform: uppercase; color: var(--vurgu); margin-bottom: 18px; }
  h1, h2, h3 { font-family: var(--baslik); font-weight: 500; line-height: 1.2; letter-spacing: .5px; }
  h2 { font-size: 40px; margin-bottom: 18px; }
  h3 { font-size: 22px; margin-bottom: 10px; }
  .giris { font-size: 21px; color: var(--gri); max-width: 640px; font-weight: 300; }
  .gece .giris { color: #A9A398; }
  .bolum-bas { display: flex; justify-content: space-between; align-items: flex-end; gap: 40px; margin-bottom: 52px; }
  .alt-yazi { font-size: 13px; color: var(--gri2); font-style: italic; margin-top: 8px; }
  .not-tr { font-size: 14px; color: var(--gri2); font-style: italic; margin-bottom: 14px; }

  /* AÇILIŞ */
  .acilis { position: relative; min-height: calc(100vh - 76px); max-height: 860px; display: flex; align-items: flex-end; color: #fff; overflow: hidden; background: var(--gece); }
  .acilis-gorsel { position: absolute; inset: 0; background-size: cover; background-position: center 40%; transform: scale(1.04); animation: yavasYaklas 18s ease-out forwards; }
  @keyframes yavasYaklas { to { transform: scale(1); } }
  .acilis::after { content: ''; position: absolute; inset: 0; background: linear-gradient(180deg, rgba(10,9,8,.15) 0%, rgba(10,9,8,.25) 45%, rgba(10,9,8,.82) 100%); }
  .acilis .kap { position: relative; z-index: 1; padding-bottom: 90px; width: 100%; }
  .acilis h1 { font-size: 58px; max-width: 820px; margin-bottom: 22px; }
  .acilis .giris { color: rgba(255,255,255,.85); font-size: 23px; margin-bottom: 36px; }
  .acilis-arama { display: flex; max-width: 620px; background: #fff; border-radius: 2px; margin-bottom: 26px; position: relative; }
  .acilis-arama input { flex: 1; border: 0; outline: 0; padding: 18px 22px; font-size: 18px; color: var(--murekkep); background: transparent; }
  .acilis-arama .btn { border-radius: 0 2px 2px 0; }
  .oneri-liste { position: absolute; top: 100%; left: 0; right: 0; background: #fff; color: var(--murekkep); border-top: 1px solid var(--cizgi); box-shadow: 0 18px 40px rgba(0,0,0,.25); display: none; z-index: 5; max-height: 360px; overflow-y: auto; }
  .oneri-liste a { display: flex; justify-content: space-between; padding: 12px 22px; font-size: 17px; border-bottom: 1px solid var(--kagit2); }
  .oneri-liste a:hover { background: var(--kagit2); }
  .oneri-liste a span { color: var(--gri2); font-size: 14px; }
  .acilis-butonlar { display: flex; gap: 14px; }
  .acilis-imza { position: absolute; right: 40px; bottom: 30px; z-index: 1; font-size: 13px; font-style: italic; color: rgba(255,255,255,.7); }

  /* NEDEN REHBER */
  .uclu { display: grid; grid-template-columns: repeat(3, 1fr); gap: 56px; }
  .madde-no { font-family: var(--baslik); font-size: 14px; color: var(--vurgu); letter-spacing: 3px; margin-bottom: 14px; }
  .madde p { color: var(--gri); font-size: 18px; }

  /* REHBER KARTLARI */
  .rehber-izgara { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 24px; }
  .rehber-kart { background: #fff; border: 1px solid var(--cizgi); padding: 30px 28px 26px; display: flex; flex-direction: column; transition: border-color .2s, transform .2s; }
  .rehber-kart:hover { border-color: var(--murekkep); transform: translateY(-2px); }
  .rehber-portre { width: 84px; height: 84px; border-radius: 50%; background: var(--kagit2) center/cover; display: flex; align-items: center; justify-content: center; font-family: var(--baslik); font-size: 32px; color: var(--vurgu); margin-bottom: 18px; }
  .rehber-kart h3 { font-size: 20px; margin-bottom: 4px; }
  .rehber-yer { font-size: 15px; color: var(--gri2); margin-bottom: 14px; }
  .rehber-kart p { font-size: 16px; color: var(--gri); flex: 1; margin-bottom: 16px; display: -webkit-box; -webkit-line-clamp: 4; -webkit-box-orient: vertical; overflow: hidden; }
  .rozetler { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 18px; }
  .rozet { font-size: 13px; padding: 2px 10px; border: 1px solid var(--cizgi); border-radius: 20px; color: var(--gri); }
  .rehber-alt { display: flex; justify-content: space-between; align-items: center; border-top: 1px solid var(--cizgi); padding-top: 16px; }
  .fiyat { font-size: 22px; font-weight: 500; }
  .fiyat small { font-size: 14px; color: var(--gri2); font-weight: 400; }
  .puan { font-size: 15px; color: var(--gri); }
  .rehber-kart .btn { margin-top: 18px; justify-content: center; }
  .bos-durum { padding: 40px; border: 1px dashed var(--cizgi); text-align: center; color: var(--gri); }

  /* DÖNEM ÇİZELGESİ */
  .cizelge { display: grid; grid-template-columns: repeat(7, 1fr); border-top: 1px solid #3A3631; }
  .donem { padding: 26px 18px 30px; border-right: 1px solid #3A3631; cursor: pointer; position: relative; transition: background .25s; }
  .donem:last-child { border-right: 0; }
  .donem::before { content: ''; position: absolute; top: -5px; left: 18px; width: 9px; height: 9px; border-radius: 50%; background: var(--gece); border: 1px solid var(--altin); transition: background .25s; }
  .donem:hover { background: var(--gece2); }
  .donem:hover::before { background: var(--altin); }
  .donem-emoji { font-size: 26px; margin-bottom: 14px; }
  .donem h3 { font-size: 17px; color: #fff; margin-bottom: 6px; }
  .donem-tarih { font-size: 14px; color: #8D877C; margin-bottom: 14px; }
  .donem-sayi { font-size: 14px; color: var(--altin); }

  /* HARİTA */
  .harita-kap { height: 560px; border: 1px solid var(--cizgi); }
  .harita-kap.kucuk { height: 300px; }
  .leaflet-popup-content { font-family: var(--serif); font-size: 15px; }
  .leaflet-popup-content b { font-family: var(--baslik); font-weight: 500; }
  .leaflet-popup-content a { color: var(--vurgu); }

  /* HİKÂYE */
  .hikaye { display: grid; grid-template-columns: 1.05fr 1fr; gap: 72px; align-items: center; }
  .hikaye-gorsel { aspect-ratio: 4/5; background: var(--gece2) center/cover; }
  .hikaye blockquote { font-size: 21px; line-height: 1.75; color: #D8CFC0; white-space: pre-line; margin: 24px 0 30px; max-height: 15.5em; overflow: hidden; -webkit-mask-image: linear-gradient(180deg, #000 70%, transparent); mask-image: linear-gradient(180deg, #000 70%, transparent); }

  /* TUR PLANLA */
  .ikili { display: grid; grid-template-columns: 1fr 1fr; gap: 72px; align-items: start; }
  .form-izgara { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; }
  .form-izgara .tam { grid-column: 1 / -1; }
  label.etiket { display: block; font-size: 14px; letter-spacing: 1px; color: var(--gri); margin-bottom: 6px; }
  .girdi { width: 100%; border: 1px solid var(--cizgi); background: #fff; padding: 12px 14px; font-size: 17px; border-radius: 2px; outline: 0; transition: border-color .2s; }
  .girdi:focus { border-color: var(--murekkep); }
  textarea.girdi { min-height: 110px; resize: vertical; }
  .secimler { display: flex; flex-wrap: wrap; gap: 8px; }
  .secim { border: 1px solid var(--cizgi); background: #fff; padding: 6px 14px; border-radius: 20px; font-size: 15px; cursor: pointer; transition: all .2s; user-select: none; }
  .secim.aktif { background: var(--murekkep); border-color: var(--murekkep); color: #fff; }
  .plan-sonuc { background: #fff; border: 1px solid var(--cizgi); padding: 34px 38px; white-space: pre-wrap; font-size: 17px; line-height: 1.75; min-height: 420px; color: var(--gri); }
  .plan-sonuc.dolu { color: var(--murekkep); }
  .form-mesaj { margin-top: 14px; font-size: 16px; }
  .form-mesaj.hata { color: #B03A2E; }
  .form-mesaj.basari { color: #2E7D52; }

  /* YORUMLAR */
  .yorum-izgara { display: grid; grid-template-columns: repeat(3, 1fr); gap: 28px; }
  .yorum { border-top: 1px solid var(--murekkep); padding-top: 22px; }
  .yorum p { font-size: 19px; font-style: italic; margin-bottom: 16px; }
  .yorum-kim { font-size: 15px; color: var(--gri); }
  #yPuan .secim { border: 0; background: none; padding: 0 2px; font-size: 28px; color: var(--cizgi); }
  #yPuan .secim.aktif { color: var(--altin); background: none; }
  .yildiz { color: var(--altin); letter-spacing: 2px; font-size: 14px; }

  /* UYGULAMA */
  .uygulama { display: flex; justify-content: space-between; align-items: center; gap: 40px; }

  /* ÖREN YERİ KARTLARI */
  .filtreler { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; margin-bottom: 36px; padding-bottom: 26px; border-bottom: 1px solid var(--cizgi); }
  .filtreler .girdi { width: auto; padding: 9px 12px; font-size: 16px; }
  .filtreler .arama { flex: 1; min-width: 220px; }
  .sonuc-sayi { font-size: 15px; color: var(--gri2); margin-left: auto; }
  .yer-izgara { display: grid; grid-template-columns: repeat(auto-fill, minmax(270px, 1fr)); gap: 36px 28px; }
  .yer-kart { cursor: pointer; }
  .yer-kart-gorsel { aspect-ratio: 4/3; background: var(--kagit2) center/cover; margin-bottom: 14px; position: relative; overflow: hidden; display: flex; align-items: center; justify-content: center; font-size: 46px; }
  .yer-kart-gorsel img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; transition: transform .6s; }
  .yer-kart:hover .yer-kart-gorsel img { transform: scale(1.04); }
  .unesco-rozet { position: absolute; top: 10px; left: 10px; z-index: 1; background: rgba(18,17,15,.75); color: #fff; font-size: 11px; letter-spacing: 2px; padding: 3px 8px; }
  .yer-kart h3 { font-size: 19px; margin-bottom: 2px; }
  .yer-kart-alt { font-size: 15px; color: var(--gri2); }

  /* ÖREN YERİ DETAY */
  .galeri { display: grid; grid-template-columns: 2fr 1fr; grid-template-rows: 1fr 1fr; gap: 8px; height: 560px; margin-bottom: 52px; }
  .galeri div { background: var(--kagit2) center/cover; cursor: zoom-in; }
  .galeri div:first-child { grid-row: 1 / 3; }
  .galeri.tek { grid-template-columns: 1fr; display: flex; align-items: center; justify-content: center; font-size: 90px; background: var(--kagit2); height: 360px; }
  .detay { display: grid; grid-template-columns: 1fr 360px; gap: 72px; }
  .detay h1 { font-size: 50px; margin-bottom: 6px; }
  .detay-sehir { font-size: 20px; color: var(--gri); margin-bottom: 30px; }
  .bilgi-satir { display: flex; gap: 40px; padding: 18px 0; border-top: 1px solid var(--cizgi); border-bottom: 1px solid var(--cizgi); margin-bottom: 36px; }
  .bilgi-satir div small { display: block; font-size: 13px; letter-spacing: 1px; color: var(--gri2); }
  .bilgi-satir div b { font-weight: 500; font-size: 18px; }
  .detay-metin { font-size: 21px; line-height: 1.75; margin-bottom: 44px; }
  .detay h2 { font-size: 26px; margin: 48px 0 18px; }
  .efsane-kutu { background: var(--gece); color: #D8CFC0; padding: 40px 44px; }
  .efsane-kutu h3 { color: #fff; font-size: 22px; }
  .efsane-kutu div { white-space: pre-line; font-size: 18px; line-height: 1.8; }
  .unlu-satir { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 18px; }
  .unlu { border: 1px solid var(--cizgi); padding: 18px; cursor: pointer; display: flex; gap: 14px; align-items: center; background: #fff; transition: border-color .2s; }
  .unlu:hover { border-color: var(--murekkep); }
  .unlu-foto { width: 54px; height: 54px; border-radius: 50%; background: var(--kagit2) center/cover; flex-shrink: 0; display: flex; align-items: center; justify-content: center; font-size: 22px; }
  .unlu b { display: block; font-weight: 500; font-size: 17px; line-height: 1.3; }
  .unlu small { color: var(--gri2); font-size: 14px; }
  .yan { position: sticky; top: 106px; align-self: start; }
  .yan-kutu { border: 1px solid var(--cizgi); background: #fff; padding: 28px; margin-bottom: 24px; }
  .yan-kutu h3 { font-size: 18px; margin-bottom: 16px; }
  .ziyaret dl { display: grid; grid-template-columns: auto 1fr; gap: 10px 18px; font-size: 16px; }
  .ziyaret dt { color: var(--gri2); }
  .yorum-liste .yorum { margin-bottom: 26px; }

  /* SAYFA BAŞLIĞI */
  .sayfa-bas { padding: 90px 0 50px; }
  .sayfa-bas h1 { font-size: 52px; margin-bottom: 18px; }
  .metin-sutun { max-width: 760px; }
  .metin-sutun p { font-size: 20px; line-height: 1.8; margin-bottom: 22px; }
  .metin-sutun h2 { font-size: 28px; margin: 46px 0 16px; }
  .adimlar { counter-reset: adim; display: grid; grid-template-columns: repeat(4, 1fr); gap: 30px; margin: 30px 0 70px; }
  .adim { border-top: 1px solid var(--murekkep); padding-top: 18px; }
  .adim::before { counter-increment: adim; content: '0' counter(adim); font-family: var(--baslik); color: var(--vurgu); font-size: 14px; letter-spacing: 3px; display: block; margin-bottom: 8px; }
  .adim p { color: var(--gri); font-size: 17px; }

  /* MODAL */
  .modal { position: fixed; inset: 0; z-index: 100; background: rgba(10,9,8,.72); display: none; align-items: center; justify-content: center; padding: 30px; }
  .modal.acik { display: flex; }
  .modal-ic { background: var(--kagit); width: 100%; max-width: 640px; max-height: calc(100vh - 60px); overflow-y: auto; position: relative; padding: 44px 48px; }
  .modal-ic.genis { max-width: 980px; padding: 0; display: grid; grid-template-columns: 1fr 1fr; }
  .modal-kapat { position: absolute; top: 14px; right: 16px; border: 0; background: none; font-size: 26px; cursor: pointer; color: var(--gri); z-index: 2; line-height: 1; }
  .modal-ic h2 { font-size: 30px; }
  .pencere-gorsel { background: var(--gece) center/cover; min-height: 520px; display: flex; align-items: center; justify-content: center; font-size: 80px; }
  .pencere-metin { padding: 48px 44px; overflow-y: auto; max-height: calc(100vh - 60px); }
  .pencere-metin .govde { white-space: pre-wrap; font-size: 18px; line-height: 1.8; color: #3A3631; }
  .soz { font-size: 21px; font-style: italic; border-left: 2px solid var(--vurgu); padding-left: 20px; margin: 22px 0; }
  .buyuk-foto { max-width: 92vw; max-height: 88vh; }

  /* ALT BİLGİ */
  .alt { background: var(--gece); color: #8D877C; padding: 80px 0 40px; font-size: 16px; }
  .alt-izgara { display: grid; grid-template-columns: 1.6fr 1fr 1fr 1fr; gap: 40px; margin-bottom: 60px; }
  .alt .logo { color: #fff; margin-bottom: 16px; }
  .alt h4 { font-family: var(--baslik); font-weight: 500; color: #E9E3D8; font-size: 14px; letter-spacing: 2px; margin-bottom: 16px; }
  .alt a { display: block; margin-bottom: 8px; transition: color .2s; }
  .alt a:hover { color: #fff; }
  .alt-cizgi { border-top: 1px solid #2A2724; padding-top: 26px; display: flex; justify-content: space-between; font-size: 14px; }

  .yukleniyor { color: var(--gri2); font-style: italic; }
  .gizli { display: none !important; }

  @media (max-width: 1100px) {
    .menu { gap: 18px; } .menu a { font-size: 15px; }
    .cizelge { grid-template-columns: repeat(4, 1fr); }
    .detay { grid-template-columns: 1fr; } .yan { position: static; }
    .alt-izgara { grid-template-columns: 1fr 1fr; }
  }
  @media (max-width: 900px) {
    .kap { padding: 0 24px; }
    .ust .rehberle-btn { display: none; }
    .acilis h1 { font-size: 42px; }
    .uclu, .yorum-izgara, .hikaye, .ikili, .adimlar { grid-template-columns: 1fr; gap: 40px; }
    .modal-ic.genis { grid-template-columns: 1fr; } .pencere-gorsel { min-height: 260px; }
    .galeri { height: 380px; }
  }
</style>
</head>
<body>

<header class="ust">
  <div class="kap">
    <a href="#/" class="logo">ANADO<span>L</span>U<small data-t="logoAlt"></small></a>
    <nav class="menu">
      <a href="#/yerler" data-t="mYerler" data-yol="yerler"></a>
      <a href="#/rehberler" data-t="mRehberler" data-yol="rehberler"></a>
      <a href="#/tur-planla" data-t="mTur" data-yol="tur-planla"></a>
      <a href="#/hakkimizda" data-t="mHakkimizda" data-yol="hakkimizda"></a>
      <a href="#/rehber-ol" data-t="mRehberOl" data-yol="rehber-ol"></a>
      <a href="#/iletisim" data-t="mIletisim" data-yol="iletisim"></a>

};

};
const DIL_TAM = { tr: 'Türkçe', en: 'English', de: 'Deutsch', ru: 'на русском языке' };
const SAAT_CEVIRI = { 'Her zaman açık': { en: 'Always open', de: 'Immer geöffnet', ru: 'Открыто всегда' } };

let dil = (() => {
  try { const k = localStorage.getItem('webDil'); if (T[k]) return k; } catch (e) {}
  const n = (navigator.language || 'tr').slice(0, 2);
  return T[n] ? n : 'tr';
})();
const t = k => (T[dil][k] ?? T.tr[k] ?? k);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c]));
const sayi = n => Number(n).toLocaleString({ tr:'tr-TR', en:'en-GB', de:'de-DE', ru:'ru-RU' }[dil]);

function dilDegistir(yeni) {
  dil = yeni;
  try { localStorage.setItem('webDil', yeni); } catch (e) {}
  document.documentElement.lang = yeni;
  sabitMetinler();
  yonlendir();
}

function sabitMetinler() {
  document.querySelectorAll('[data-t]').forEach(el => { el.textContent = t(el.dataset.t); });
  document.getElementById('dilSec').innerHTML = ['tr','en','de','ru'].map(d =>
    `<button class="${d === dil ? 'aktif' : ''}" onclick="dilDegistir('${d}')">${d.toUpperCase()}</button>`).join('');
  document.getElementById('altBolgeler').innerHTML = Object.keys(BOLGE_AD.tr).map(b =>
    `<a href="#/yerler?bolge=${b}">${esc(BOLGE_AD[dil][b])}</a>`).join('');
}

// İçerik yardımcıları (çeviri varsa onu, yoksa Türkçesini verir)
function yerIsim(y) { return dil !== 'tr' && ({ en: ISIMLER_EN, de: ISIMLER_DE, ru: ISIMLER_RU }[dil] || {})[y.id] || y.isim; }
function yerAciklama(y) { return dil !== 'tr' && ({ en: ACIKLAMALAR_EN, de: ACIKLAMALAR_DE, ru: ACIKLAMALAR_RU }[dil] || {})[y.id] || y.aciklama; }
function medeniyet(m) { return dil !== 'tr' && ({ en: MEDENIYETLER_EN, de: MEDENIYETLER_DE, ru: MEDENIYETLER_RU }[dil] || {})[m] || m; }
function yilYaz(n) { return n < 0 ? `${t('onc') === 'M.Ö.' ? 'M.Ö. ' + sayi(-n) : sayi(-n) + ' ' + t('onc')}` : (dil === 'en' ? 'AD ' + n : dil === 'tr' ? 'M.S. ' + n : n + ' ' + t('sonra')); }
function saatYaz(s) { return dil !== 'tr' && SAAT_CEVIRI[s] ? SAAT_CEVIRI[s][dil] : s; }
function fotolar(y, w = 1200) { return (GALERI_MAP[y.id] || []).map(k => `${CDN}/f_auto,q_auto,w_${w}/${encodeURIComponent(k)}`); }
function yerBul(id) { return YERLER.find(y => String(y.id) === String(id)); }
function yildizlar(n) { n = Math.round(Number(n) || 0); return '★'.repeat(n) + '☆'.repeat(Math.max(0, 5 - n)); }

let harita = null;

function yonlendir() {
  const [yol, sorgu = ''] = location.hash.replace(/^#\/?/, '').split('?');
  const [ad, param] = yol.split('/');
  const parametreler = Object.fromEntries(new URLSearchParams(sorgu));
  if (harita) { harita.remove(); harita = null; }
  modalKapat();
  document.querySelectorAll('.menu a').forEach(a => a.classList.toggle('aktif', a.dataset.yol === ad));
  (SAYFALAR[ad] || anaSayfa)(param, parametreler);
  window.scrollTo(0, 0);
}
window.addEventListener('hashchange', yonlendir);

// SUPABASE
// ════════════════════════════════════════════════════════════════════════
async function sbGet(yol) {
  const res = await fetch(`${SAPI}/${yol}`, { headers: SB_BASLIK });
  if (!res.ok) throw new Error(res.status);
  return res.json();
}
async function sbPost(tablo, veri) {
  return fetch(`${SAPI}/${tablo}`, { method: 'POST', headers: { ...SB_BASLIK, 'Content-Type': 'application/json', 'Prefer': 'return=minimal' }, body: JSON.stringify(veri) });
}
async function yapayZeka(prompt) {
  const res = await fetch(`${SUPABASE_URL}/functions/v1/tur-planlayici`, { method: 'POST', headers: { ...SB_BASLIK, 'Content-Type': 'application/json' }, body: JSON.stringify({ prompt }) });
  if (!res.ok) throw new Error(res.status);
  const d = await res.json();
  // Yapay zekâ bazen Markdown işaretleri (#, **) döndürüyor; düz metne çevir
  return (d.plan || d.response || d.result || '').replace(/^#{1,6}\s*/gm, '').replace(/\*\*/g, '');
}

function yerKarti(y) {
  const f = fotolar(y, 700)[0];
  return `<a class="yer-kart" href="#/yer/${y.id}">
    <div class="yer-kart-gorsel">${y.unesco ? '<span class="unesco-rozet">UNESCO</span>' : ''}${f ? `<img src="${f}" alt="${esc(yerIsim(y))}" loading="lazy" onerror="this.remove()">` : ''}${esc(y.emoji)}</div>
    <h3>${esc(yerIsim(y))}</h3>
    <div class="yer-kart-alt">${esc(y.sehir)} · ${esc(DONEM_AD[dil][y.donem - 1])}</div>
  </a>`;
}

function rehberKarti(r) {
  const portre = r.foto_url ? `style="background-image:url('${esc(r.foto_url)}')"` : '';
  const diller = (r.diller || []).map(d => `<span class="rozet">${esc(DIL_AD[dil][d] || d)}</span>`).join('');
  const puan = Number(r.yorum_sayisi) > 0 ? `<span class="puan"><span class="yildiz">★</span> ${Number(r.ortalama_puan).toFixed(1)} · ${r.yorum_sayisi} ${t('degerlendirme')}</span>` : `<span class="puan">${t('yeni')}</span>`;
  return `<div class="rehber-kart">
    <div class="rehber-portre" ${portre}>${r.foto_url ? '' : esc((r.ad_soyad || '?').charAt(0))}</div>
    <h3>${esc(r.ad_soyad)}</h3>
    <div class="rehber-yer">${esc(r.sehir || '')}${r.deneyim_yil ? ` · ${r.deneyim_yil} ${t('yilDeneyim')}` : ''}</div>
    <div class="rozetler">${diller}</div>
    <p>${esc(r.hakkinda || '')}</p>
    <div class="rehber-alt">
      <span class="fiyat">${r.gunluk_ucret ? `₺${sayi(r.gunluk_ucret)} <small>/ ${t('gun')}</small>` : ''}</span>${puan}
    </div>
    <button class="btn" onclick='rezervasyonAc(${JSON.stringify({ id: r.id, ad: r.ad_soyad, ucret: r.gunluk_ucret, bolgeler: r.bolgeler || [] }).replace(/'/g, '&#39;')})'>${t('rezervasyon')}</button>
  </div>`;
}

async function rehberleriDoldur(kapId, bolge, limit) {
  const kap = document.getElementById(kapId);
  kap.innerHTML = `<p class="yukleniyor">${t('yukleniyor')}</p>`;
  try {
    let yol = `rehberler?select=${REHBER_ALANLAR}&onaylandi=eq.true&order=one_cikan.desc.nullslast,ortalama_puan.desc.nullslast`;
    if (bolge) yol += `&bolgeler=cs.{${bolge}}`;
    if (limit) yol += `&limit=${limit}`;
    const liste = await sbGet(yol);
    kap.innerHTML = liste.length ? `<div class="rehber-izgara">${liste.map(rehberKarti).join('')}</div>` : `<div class="bos-durum">${t('rehberYok')}</div>`;
  } catch (e) { kap.innerHTML = `<div class="bos-durum">${t('hata')}</div>`; }
}

function haritaKur(kapId, yerler, odak) {
  if (typeof L === 'undefined') return;
  harita = L.map(kapId, { scrollWheelZoom: false }).setView(odak || [38.9, 35.2], odak ? 10 : 6);
  L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png', { attribution: '© OpenStreetMap © CARTO', maxZoom: 18 }).addTo(harita);
  yerler.forEach(y => {
    const k = KOORDINATLAR[y.id]; if (!k) return;
    L.circleMarker(k, { radius: 6, color: '#B85C2A', weight: 1.5, fillColor: '#B85C2A', fillOpacity: .75 })
      .addTo(harita).bindPopup(`<b>${esc(yerIsim(y))}</b><br>${esc(y.sehir)} · ${esc(DONEM_AD[dil][y.donem - 1])}<br><a href="#/yer/${y.id}">${t('detayaGit')}</a>`);
  });
}

function aramaEsles(q) {
  q = q.trim().toLocaleLowerCase('tr');
  if (q.length < 2) return [];
  return YERLER.filter(y => [y.isim, yerIsim(y), y.sehir, ...(y.medeniyetler || []).map(medeniyet), ...(y.medeniyetler || [])]
    .some(s => (s || '').toLocaleLowerCase('tr').includes(q)));
}
function oneriGoster(q) {
  const kutu = document.getElementById('oneriListe');
  const s = aramaEsles(q).slice(0, 8);
  kutu.style.display = s.length ? 'block' : 'none';
  kutu.innerHTML = s.map(y => `<a href="#/yer/${y.id}">${esc(yerIsim(y))}<span>${esc(y.sehir)}</span></a>`).join('');

function aramaYap() {

async function yorumlariYukle(id) {
  const kap = document.getElementById('yerYorumlari');
  try {
    const liste = await sbGet(`yorumlar?select=kullanici_adi,sehir,yorum,puan,olusturma_tarihi&oren_yeri_id=eq.${encodeURIComponent(id)}&order=olusturma_tarihi.desc&limit=20`);

  } catch (e) { kap.innerHTML = `<p class="yukleniyor">${t('hata')}</p>`; }

async function yorumGonder(id) {
  const ad = document.getElementById('yAd').value.trim(), metin = document.getElementById('yMetin').value.trim();
  const mesaj = document.getElementById('yMesaj');
  if (!ad || !metin) { mesaj.className = 'form-mesaj hata'; mesaj.textContent = t('eksikAlan'); return; }
  const res = await sbPost('yorumlar', { oren_yeri_id: String(id), kullanici_adi: ad, sehir: document.getElementById('ySehir').value.trim() || null, yorum: metin, puan: seciliPuan }).catch(() => null);
  if (res && res.ok) {
    mesaj.className = 'form-mesaj basari'; mesaj.textContent = t('yorumTesekkur');
    document.getElementById('yMetin').value = '';
    yorumlariYukle(id);
  } else { mesaj.className = 'form-mesaj hata'; mesaj.textContent = t('hata'); }
}

const pencereOnbellek = {};
let pencereAktif = null;

async function donemPenceresi(id) {
  const m = DONEM_META[id], [a, b] = DONEM_ARALIK[id];
  pencereAktif = id + dil;
  const gorsel = `https://image.pollinations.ai/prompt/${encodeURIComponent(m.imgPrompt)}?width=900&height=1100&nologo=true&seed=${id}`;
  modalAc(`
    <div class="pencere-gorsel" id="pencereGorsel">${m.emoji}</div>
    <div class="pencere-metin">
      <div class="ust-etiket">${t('pencereEtiket')}</div>
      <h2>${DONEM_AD[dil][id - 1]}</h2>
      <div style="color:var(--gri2);margin-bottom:24px">${yilYaz(a)} – ${yilYaz(b)}</div>
      <div class="govde" id="pencereGovde"><span class="yukleniyor">${t('pencereHazirlaniyor')}</span></div>
      <div class="rozetler" style="margin-top:24px">${m.medeniyetler.map(x => `<span class="rozet">${esc(medeniyet(x))}</span>`).join('')}</div>
      <a class="btn" style="margin-top:20px" href="#/yerler?donem=${id}">${t('buDonemYerler')}</a>
      <p class="alt-yazi">${t('pencereGorsel')}</p>
    </div>`, true);
  const img = new Image();
  img.onload = () => { const el = document.getElementById('pencereGorsel'); if (el && pencereAktif === id + dil) { el.style.backgroundImage = `url('${gorsel}')`; el.textContent = ''; } };
  img.src = gorsel;

  const anahtar = id + dil;
  if (!pencereOnbellek[anahtar]) {
    try {
      const prompt = m.aiPrompt.replace(/Türkçe, maksimum 180 kelime\./, `Yanıtı ${DIL_TAM[dil]} dilinde yaz, maksimum 180 kelime.`);
      const metin = await yapayZeka(prompt);
      if (metin) pencereOnbellek[anahtar] = metin;
    } catch (e) {}
  }
  if (pencereAktif !== anahtar) return;
  const g = document.getElementById('pencereGovde');
  if (g) g.textContent = pencereOnbellek[anahtar] || t('pencereYedek');
}

async function rezervasyonGonder(r) {
  const v = id => document.getElementById(id).value.trim();
  const mesaj = document.getElementById('rMesaj'), btn = document.getElementById('rGonderBtn');
  const ad = v('rAd'), email = v('rEmail'), tarih = v('rTarih'), yer = v('rYer');
  if (!ad || !/^\S+@\S+\.\S+$/.test(email) || !tarih || !yer) { mesaj.className = 'form-mesaj hata'; mesaj.textContent = t('eksikAlan'); return; }
  btn.disabled = true;
  const res = await sbPost('rezervasyonlar', {
    rehber_id: r.id, musteri_adi: ad, musteri_email: email, musteri_telefon: v('rTel') || null,
    oren_yeri_id: yer, tur_tarihi: tarih, kisi_sayisi: parseInt(v('rKisi')) || 1, dil: v('rDil'), notlar: v('rNot') || null
  }).catch(() => null);
  if (res && res.ok) {
    // Mobil uygulamadaki gibi komisyon kaydı (admin panelinde takip için)
    if (r.ucret) sbPost('komisyonlar', { rehber_id: r.id, rehber_adi: r.ad, musteri_adi: ad, oren_yeri_id: yer, tur_tarihi: tarih, rehber_ucreti: r.ucret, komisyon_orani: 15, komisyon_tutar: Math.round(r.ucret * 15 / 100), odeme_durumu: 'bekliyor' }).catch(() => {});
    document.getElementById('modalIc').innerHTML = `<button class="modal-kapat" onclick="modalKapat()">×</button><div class="ust-etiket">${t('rezBaslik')}</div><h2>✓</h2><p style="font-size:20px">${t('rezTesekkur')}</p>`;
  } else { btn.disabled = false; mesaj.className = 'form-mesaj hata'; mesaj.textContent = t('hata'); }
}

async function planOlustur() {
  const sec = id => [...document.querySelectorAll(`#${id} .secim.aktif`)].map(e => e.textContent);
  const btn = document.getElementById('tBtn'), sonuc = document.getElementById('tSonuc');
  btn.disabled = true; sonuc.className = 'plan-sonuc'; sonuc.textContent = t('planHazirlaniyor');
  const ilgili = YERLER.filter(y => { const b = sec('tBolge'); return !b.length || b.map(x => Object.keys(BOLGE_AD[dil]).find(k => BOLGE_AD[dil][k] === x)).includes(y.bolge); }).map(y => y.isim).join(', ');
  const prompt = `Sen Türkiye'nin tarihi ören yerleri konusunda uzman bir tur rehberisin. Aşağıdaki bilgilere göre kişiselleştirilmiş bir tur planı oluştur. Yanıtını ${DIL_TAM[dil]} dilinde ver.

- Süre: ${document.getElementById('tGun').value} gün
- Başlangıç noktası: ${document.getElementById('tBas').value.trim() || 'belirtilmedi'}
- İlgi alanları: ${sec('tIlgi').join(', ') || 'Genel tarih'}
- Tercih edilen bölgeler: ${sec('tBolge').join(', ') || 'Tüm Türkiye'}
- Bütçe: ${document.getElementById('tButce').value}
${document.getElementById('tNot').value.trim() ? `- Özel notlar: ${document.getElementById('tNot').value.trim()}` : ''}

Planı öncelikle şu ören yerlerinden seç: ${ilgili}

Şu formatta yaz:
- Her gün için başlık ve ziyaret edilecek ören yerleri
- Her yer için kısa açıklama ve tahmini süre
- Pratik öneriler (ulaşım, konaklama, yemek)
- Toplam bütçe tahmini

Somut ve pratik ol, abartılı sıfatlardan kaçın.`;
  try {
    const plan = await yapayZeka(prompt);
    sonuc.className = 'plan-sonuc dolu';
    sonuc.textContent = plan || t('hata');
  } catch (e) { sonuc.textContent = t('hata'); }
  btn.disabled = false;
}

        <div><label class="etiket">${t('rUcret')}</label><input class="girdi" id="bUcret" type="number" min="0" step="50"></div>
        <div class="tam"><label class="etiket">${t('rHakkinda')}</label><textarea class="girdi" id="bHakkinda" maxlength="1500" placeholder="${esc(t('rHakkindaPh'))}"></textarea></div>
      </div>
      <button class="btn vurgu" id="bBtn" style="margin-top:18px" onclick="basvuruGonder()">${t('rGonder')}</button>
      <div class="form-mesaj" id="bMesaj"></div>
    </div>
  </div></section>`;
}

async function basvuruGonder() {
  const v = id => document.getElementById(id).value.trim();
  const sec = id => [...document.querySelectorAll(`#${id} .secim.aktif`)].map(e => e.dataset.v);
  const mesaj = document.getElementById('bMesaj'), btn = document.getElementById('bBtn');
  if (!v('bAd') || !/^\S+@\S+\.\S+$/.test(v('bEmail')) || !v('bSehir') || !v('bKokart')) { mesaj.className = 'form-mesaj hata'; mesaj.textContent = t('eksikAlan'); return; }
  if (!sec('bDiller').length || !sec('bBolgeler').length) { mesaj.className = 'form-mesaj hata'; mesaj.textContent = t('rDilSec'); return; }
  btn.disabled = true;
  const res = await sbPost('rehberler', {
    ad_soyad: v('bAd'), email: v('bEmail'), telefon: v('bTel') || null, sehir: v('bSehir'),
    diller: sec('bDiller'), bolgeler: sec('bBolgeler'), sertifika: v('bKokart'),
    deneyim_yil: parseInt(v('bDeneyim')) || 0, gunluk_ucret: parseInt(v('bUcret')) || null,
    hakkinda: v('bHakkinda') || null, onaylandi: false
  }).catch(() => null);
  if (res && res.ok) {
    btn.closest('div').innerHTML = `<h2>✓</h2><p class="giris">${t('rTesekkur')}</p>`;
  } else { btn.disabled = false; mesaj.className = 'form-mesaj hata'; mesaj.textContent = t('hata'); }
}

function iletisimSayfasi() {
  const satirlar = [
    ILETISIM.email && `<p><b>E-posta</b><br><a href="mailto:${esc(ILETISIM.email)}" style="color:var(--vurgu)">${esc(ILETISIM.email)}</a></p>`,
    ILETISIM.whatsapp && `<p><b>WhatsApp</b><br><a href="https://wa.me/${esc(ILETISIM.whatsapp.replace(/\D/g, ''))}" target="_blank" rel="noopener" style="color:var(--vurgu)">${esc(ILETISIM.whatsapp)}</a></p>`,
    ILETISIM.instagram && `<p><b>Instagram</b><br><a href="https://instagram.com/${esc(ILETISIM.instagram.replace('@', ''))}" target="_blank" rel="noopener" style="color:var(--vurgu)">${esc(ILETISIM.instagram)}</a></p>`
  ].filter(Boolean).join('');
  sayfa().innerHTML = `
  <section class="sayfa-bas"><div class="kap"><div class="ust-etiket">${t('mIletisim')}</div><h1>${t('iletBaslik')}</h1><p class="giris">${t('iletAlt')}</p></div></section>
  <section style="padding-bottom:110px"><div class="kap ikili">
    <div class="metin-sutun">
      ${satirlar || `<p>${t('iletYakinda')}</p>`}
      <p>${t('iletDiller')}</p>
      <p class="alt-yazi">${t('iletRezervasyon')}</p>
    </div>
    <div class="hikaye-gorsel" style="background-image:url('${CDN}/f_auto,q_auto,w_1200/assos_3_tfnq7g')"></div>
  </div></section>`;
}

function modalAc(icerik, genis) {
  const m = document.getElementById('modal');
  document.getElementById('modalIc').outerHTML = `<div class="modal-ic ${genis ? 'genis' : ''}" id="modalIc"><button class="modal-kapat" onclick="modalKapat()">×</button>${icerik}</div>`;
  m.classList.add('acik');
  document.body.style.overflow = 'hidden';
}
function modalKapat() {
  pencereAktif = null;
  document.getElementById('modal').classList.remove('acik');
  document.body.style.overflow = '';
}
document.addEventListener('keydown', e => { if (e.key === 'Escape') modalKapat(); });
document.addEventListener('click', e => { if (!e.target.closest('.acilis-arama')) { const k = document.getElementById('oneriListe'); if (k) k.style.display = 'none'; } });
